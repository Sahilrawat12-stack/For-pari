<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Pari ❤️</title>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:Arial,sans-serif;
}

.box{
background:white;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.2);
width:320px;
}

h1{
color:#ff4d6d;
}

p{
font-size:18px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:25px;
background:#ff4d6d;
color:white;
cursor:pointer;
margin-top:20px;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
}
</style>

</head>

<body>

<div class="box">
<h1>Hey Pari ❤️</h1>

<p>Welcome to a small game made just for you 🥹</p>

<p>Ready?</p>

<button onclick="nextPage()">Start 💖</button>
</div>

<script>
function nextPage(){
window.location.href="./page2.html";
}
</script>

</body>
</html>

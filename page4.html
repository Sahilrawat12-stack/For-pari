<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Question ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fecfef);
font-family:Arial,sans-serif;
overflow:hidden;
}

.box{
background:white;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.2);
width:350px;
}

h2{
color:#ff4d6d;
}

button{
padding:12px 22px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#bdbdbd;
position:absolute;
}
</style>
</head>

<body>

<div class="box">
<h2>One Last Question... ❤️</h2>
<p>Will You Stay With Me Forever? 🥹</p>

<button id="yes" onclick="nextPage()">Yes 💍</button>
<button id="no" onmouseover="moveButton()">No 🙈</button>

</div>

<script>

function nextPage(){
window.location.href="./page5.html";
}

function moveButton(){
let btn=document.getElementById("no");

let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);

btn.style.left=x+"px";
btn.style.top=y+"px";
}

</script>

</body>
</html>

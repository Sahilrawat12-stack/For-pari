<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 1 ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd1dc,#ffe4e1);
font-family:Arial,sans-serif;
overflow:hidden;
}

.box{
background:white;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.2);
width:340px;
}

button{
padding:12px 22px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
margin:10px;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#d9d9d9;
position:absolute;
}
</style>

</head>

<body>

<div class="box">
<h2>Do you think I'm cute? 🥹❤️</h2>

<button id="yes" onclick="nextPage()">Yes 😍</button>
<button id="no" onmouseover="move()">No 😒</button>

</div>

<script>

function nextPage(){
window.location.href="./page3.html";
}

function move(){
let btn=document.getElementById("no");

let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);

btn.style.left=x+"px";
btn.style.top=y+"px";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ The End ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
font-family:Arial,sans-serif;
overflow:hidden;
}

.box{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.2);
width:350px;
animation:pop 1s;
}

h1{
color:#ff3366;
}

p{
font-size:20px;
line-height:1.6;
}

button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:25px;
background:#ff3366;
color:white;
cursor:pointer;
}

@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}

.heart{
position:absolute;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="box">
<h1>🎉 Congratulations Pari 🎉</h1>

<p>
You unlocked my heart ❤️<br><br>

I promise to make you smile 😊<br>
Annoy you a little 🤭<br>
Support you always 🫶<br>
And love you forever ❤️
</p>

<h2>💖 I Love You Pari 💖</h2>

<button onclick="alert('You are My Favourite Person ❤️🥹')">
Click Me 🥰
</button>

</div>

<script>

function createHeart(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
